<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUE BASICS</title>
    <!--<link rel="stylesheet" href="style.css">-->
    <style>
        #app {
        border: dashed black 1px;
        display: inline-block;
        padding-bottom: 10px;
        }

        #app > button {
        display: block;
        margin: auto;
        }

        #lightDiv {
        position: relative;
        width: 150px;
        height: 150px;
        }

        #lightDiv > img {
        position: relative;
        width: 100%;
        height: 100%;
        }

        #lightDiv > div {
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;
        border-radius: 50%;
        background-color: yellow;
        }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body">
    <div id="app">
        <div id="lightDiv">
            <div v-show="lightOn"></div>
            <img src="light-bulb-svgrepo-com.svg">
        </div>
        <button v-on:click="lightOn = !lightOn">Switch light</button>
    </div>
    <script src="vue.js"></script>
</body>
</html>
